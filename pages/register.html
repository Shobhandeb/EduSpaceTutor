<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | EDU SPACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">

    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-brand">
                <i data-lucide="hexagon" class="brand-icon"></i>
                <span class="brand-text">EDU <span class="text-glow-cyan">SPACE</span></span>
            </a>
            <div class="nav-links">
                <a href="../index.html" class="nav-link">Home</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="glass-panel auth-box">
            <div class="text-center mb-2">
                <h2 class="auth-title">Create <span class="text-glow-cyan">Account</span></h2>
                <p class="text-muted">Register to join EDU SPACE.</p>
            </div>

            <form id="registerForm" class="contact-form">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" class="form-control" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" class="form-control" required placeholder="student@example.com">
                </div>

                <div class="form-group">
                    <label for="regPassword">Password (Min 6 characters)</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" class="form-control" required placeholder="••••••••">
                        <button type="button" class="toggle-password"><i data-lucide="eye"></i></button>
                    </div>
                </div>

                <p id="authError" class="auth-error-msg"></p>

                <button type="submit" id="registerBtn" class="btn btn-primary btn-full mt-2" style="background: var(--primary-cyan); color: #030712; font-weight: 700;">
                    <i data-lucide="user-plus"></i> Create Account
                </button>
            </form>

            <div class="auth-footer text-center mt-2">
                <p class="text-muted">Already have an account? <a href="login.html" class="text-cyan">Login Here</a></p>
            </div>
        </div>
    </div>

    <!-- Notice type="module" -->
    <script type="module" src="../js/auth.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
